name: Commerce core safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  domain-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test independent commerce rules
        run: node --experimental-transform-types --test tests/*.test.mjs
